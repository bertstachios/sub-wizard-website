<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sub Wizard — Contact</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/icon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/icon-180.png" />
  <meta name="theme-color" content="#0f1013" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1013;
      --surface: #16181c;
      --border: #26282d;
      --text: #f2f0ea;
      --text-dim: #8a8a86;
      --gold: #d89a3e;
    }
    * { box-sizing: border-box; }
    html {
      background-color: var(--bg);
    }
    body {
      margin: 0;
      padding: 32px 20px 64px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 32px;
    }
    p {
      margin: 0 0 12px;
    }
    a {
      color: var(--gold);
    }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sub Wizard — Contact</h1>
    <section>
      <p>Questions about Sub Wizard? Found a bug? Want to request a feature?</p>
      <p>Email: <a href="mailto:terry.apps@proton.me">terry.apps@proton.me</a></p>
    </section>
  </main>
</body>
</html>
