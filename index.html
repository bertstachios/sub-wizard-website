<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sub Wizard</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-180.png" />
  <style>
    :root {
      --bg: #0f1013;
      --surface: #16181c;
      --border: #26282d;
      --text: #f2f0ea;
      --text-dim: #8a8a86;
      --gold: #d89a3e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 64px 20px 80px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 32px;
      margin: 0 0 12px;
    }
    .tagline {
      color: var(--text-dim);
      font-size: 17px;
      margin: 0 0 40px;
    }
    .badges {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }
    .badge-link {
      display: inline-block;
    }
    .badge-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      height: 54px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-dim);
      font-size: 13px;
      text-decoration: none;
    }
    .badge-placeholder:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    footer {
      color: var(--text-dim);
      font-size: 13px;
    }
    footer a {
      color: var(--gold);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo.png" alt="Sub Wizard" />
    <h1>Sub Wizard</h1>
    <p class="tagline">Smart substitution planning for youth/amateur basketball coaches.</p>

    <!--
      Badge placeholders below. Replace with the official badge images:
        - App Store: https://developer.apple.com/app-store/marketing/guidelines/#section-badges
        - Google Play: https://play.google.com/intl/en_us/badges/
      Download the official artwork from those pages (do not hotlink
      third-party copies), drop the files into assets/, and swap each
      placeholder <a> below for an <img> using the downloaded badge,
      pointing href at the real App Store / Play Store listing URLs
      once the app is published.
    -->
    <div class="badges">
      <a class="badge-link badge-placeholder" href="#" aria-label="Download on the App Store (placeholder)">
        App Store — coming soon
      </a>
      <a class="badge-link badge-placeholder" href="#" aria-label="Get it on Google Play (placeholder)">
        Google Play — coming soon
      </a>
    </div>

    <footer>
      <a href="/privacy.html">Privacy Policy</a>
    </footer>
  </main>
</body>
</html>
